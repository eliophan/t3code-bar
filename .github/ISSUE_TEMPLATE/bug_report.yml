name: Bug report
description: Report a reproducible problem without private data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, use https://github.com/eliophan/t3code-bar/security/advisories/new. Never attach personal databases, pairing keys, tokens, credentials, or unredacted logs."
  - type: input
    id: bar-version
    attributes:
      label: T3 Code Bar version
      placeholder: "2.0.0-alpha.3, or an exact source commit"
    validations:
      required: true
  - type: input
    id: upstream-version
    attributes:
      label: T3 Code version or commit
      description: Include the release channel. If unavailable, explain why.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and architecture
      description: On Linux, include the desktop or compositor and package format.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior. Use synthetic examples.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized logs and screenshots
      description: Remove credentials, prompts, private paths, remote addresses, and other sensitive data before posting.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked that this report contains no credentials or personal database exports.
          required: true
