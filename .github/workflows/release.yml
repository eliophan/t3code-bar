name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test -c release
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/package_release.sh "$TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" build/*.zip build/*.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --verify-tag \
            --generate-notes \
            --notes "Universal build (Apple Silicon and Intel; Intel is untested). Ad hoc signed, no Developer ID signature, not notarized. Install or update with the command in the README."
