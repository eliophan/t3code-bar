name: Swift checks

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref, and a superseded commit never keeps a runner slot while the
# newer push waits for capacity.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    # macOS arm64 hosted capacity is the slow part, so cap the job itself and
    # keep the work identical across every ref.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Cache SwiftPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          # Keyed on the manifest only, so a source change still reuses the
          # dependency build instead of starting from an empty .build.
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-
      - name: Release build and tests
        run: swift test -c release
      - name: Packaged app launches
        # Catches resources that only resolve on the build machine, as in v1.0.0.
        run: |
          bash scripts/build_app.sh
          bash scripts/smoke_test_app.sh
      - name: Script syntax
        run: bash -n scripts/build_app.sh scripts/install.sh scripts/install-release.sh scripts/package_release.sh scripts/smoke_test_app.sh scripts/setup_hooks.sh
