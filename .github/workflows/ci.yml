name: Desktop checks

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev libgtk-layer-shell-dev librsvg2-dev patchelf
      - name: Pinned Rust toolchain
        working-directory: desktop
        run: |
          rustup show
          cargo --version
      - name: Tests and frontend build
        run: bash scripts/check.sh
      - name: Build macOS release packages
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin
          python3 scripts/package-macos.py adhoc --target darwin-aarch64 --output /tmp/t3-macos-packages
          git rev-parse HEAD > /tmp/t3-macos-packages/revision.txt
      - name: Upload macOS packages
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages-${{ github.sha }}
          path: |
            /tmp/t3-macos-packages/*.app.*
            /tmp/t3-macos-packages/metadata.json
            /tmp/t3-macos-packages/revision.txt
          if-no-files-found: error
          retention-days: 14
      - name: Build Linux packages and source receipt
        if: runner.os == 'Linux'
        run: python3 scripts/package-linux.py --output /tmp/t3-linux-packages
      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ github.sha }}
          path: /tmp/t3-linux-packages/
          if-no-files-found: error
          retention-days: 14
      - name: Script syntax
        run: bash -n scripts/check.sh scripts/setup_hooks.sh
