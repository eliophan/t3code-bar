[package]
name = "t3-code-bar-desktop"
version = "2.0.0-alpha.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
cargo-clippy = []

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
bar-core = { path = "../crates/bar-core" }
bar-updater = { path = "../crates/bar-updater" }
tauri-plugin-updater = "2.10"
url = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }
sha2 = "0.10"
rand = "0.8"

[patch.crates-io]
notify-rust = { path = "../vendor/notify-rust" }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
block = "0.1"
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "4.4", features = ["blocking"] }
gtk = "0.18"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
