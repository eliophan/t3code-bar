[package]
name = "bar-usage"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
bar-identity = { path = "../bar-identity" }
icu_collator = "2"
icu_locale = "2"
